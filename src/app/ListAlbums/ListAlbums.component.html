<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Ce projet n'utilise pas Bootstrap. Il faut éviter Bootstrap dans les projets Angular -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="ListAlbums.component.css">
  <title>TP2</title>
</head>

<body>

  <main>
    <div class="row">
      <div class="albums">
        <h3>Albums de l'artiste {{ artistName }}</h3>
        <div class="row">

          <!-- Liste d'albums d'un artiste choisi -->
          <div *ngFor="let album of albums">
            <h4>{{album.name}}</h4>
            <img [src]="album.imageUrl" alt="{{album.name}}">
            <button>Chansons</button>
          </div>


        </div>
      </div>
    </div>
  </main>

</body>

</html>
