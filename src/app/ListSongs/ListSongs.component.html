<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Ce projet n'utilise pas Bootstrap. Il faut éviter Bootstrap dans les projets Angular -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="ListSongs.component.css">
  <title>TP2</title>
</head>

<body>

  <main>
    <h3>Chansons de l'album {{albumName}}</h3>
    <div class="row">
      <!-- <div class="youtubePlayer">
        <img src="assets/images/yourubeplayer.png" alt="Youtube player">
      </div> -->
      <div *ngFor="let song of songs" class="songs">
        <div class="songList">

          <!-- Liste de chansons d'un album choisi -->
          <div>
            <p>{{ song.name }} - {{ song.artist }}</p> <!-- Affichage du nom de l'artiste -->
            <button (click)="playSong(song)">Jouer</button>
          </div>


        </div>
      </div>
    </div>
  </main>

</body>

</html>
