<!DOCTYPE html>
<html lang="en">



<body>

  <main>
    <h3>Chansons de l'album {{albumName}}</h3>
    <div class="row">
      <!-- <div class="youtubePlayer">
        <img src="assets/images/yourubeplayer.png" alt="Youtube player">
      </div> -->
      <div *ngFor="let song of songs" class="songs">
        <div class="songList">

          <!-- Liste de chansons d'un album choisi -->
          <div>
            <p>{{ song.name }} - {{ song.artist }}</p> <!-- Affichage du nom de l'artiste -->
            <button (click)="playSong(song)">Jouer</button>
          </div>


        </div>
      </div>
    </div>
    <div *ngIf="videoId" class="video-container">
      <iframe width="560" height="315" [src]="videoId" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </main>

</body>

</html>
