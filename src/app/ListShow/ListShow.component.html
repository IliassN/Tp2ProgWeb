<body>

  <main>
    <h3>{{ 'CONCERTS_OF' | translate: { artistName: artistName } }}</h3>
    <div class="row">
      <div id="map" style="width: 100%; height: 400px;" class="map"></div>

      <div class="shows">
        <div *ngFor="let concert of concerts">
          <h4>{{ concert.datetime | special }}</h4>
          <p>{{ concert.venue.country }}</p>
          <p>{{ concert.venue.city }}</p>
        </div>
      </div>
    </div>
  </main>

</body>
